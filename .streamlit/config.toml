[browser]
# Privacidad por defecto (US-05): sin telemetría de uso.
gatherUsageStats = false

[server]
# El análisis es solo de texto; no se aceptan archivos en S1.
maxUploadSize = 1

[client]
# Oculta el botón "Deploy" y opciones de desarrollador al usuario final.
toolbarMode = "viewer"

[logger]
level = "warning"

[theme]
base = "light"
font = "Google Sans:https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap"
headingFont = "Google Sans"
headingFontWeights = [700, 700, 700, 600, 600, 600]
baseFontSize = 16
primaryColor = "#0B7A75"
backgroundColor = "#F5F7F8"
secondaryBackgroundColor = "#E4EBEE"
textColor = "#13293D"
linkColor = "#0B7A75"
borderColor = "#D3DBE1"
showWidgetBorder = true
baseRadius = "0.75rem"
buttonRadius = "full"
